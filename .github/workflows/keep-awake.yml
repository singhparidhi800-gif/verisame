name: Keep VeriSame Awake 24x7 - Always On

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Keep VeriSame Awake
        run: |
          echo "Pinging https://verisame.streamlit.app"
          curl -s --max-time 30 https://verisame.streamlit.app/ > /dev/null || true
          curl -s --max-time 30 https://verisame.streamlit.app/_stcore/health > /dev/null || true
          echo "VeriSame awake - $(date)"
