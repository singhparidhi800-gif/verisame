name: Keep VeriSame Awake 24x7 - Always On

on:
  schedule:
    - cron: '*/20 * * * *'  # har 20 min
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping VeriSame App
        run: |
          echo "Pinging VeriSame..."
          curl -s -o /dev/null -w "%{http_code}" https://verisame.streamlit.app/ || true
          curl -s -o /dev/null -w "%{http_code}" https://verisame.streamlit.app/_stcore/health || true
          echo "Done - App is awake"
