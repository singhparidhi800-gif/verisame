<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Aastha 🐼</title>
<style>
body{background:linear-gradient(135deg, #ff9a9e, #fecfef, #ffc3a0); font-family:'Comic Sans MS'; margin:0; padding:0; overflow-x:hidden; text-align:center;}
.screen{min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px;}
.hidden{display:none;}
h1{color:#ff1493; font-size:42px; text-shadow:3px 3px white; animation:bounce 2s infinite;}
/* SCRATCH CARD */
.scratch-container{position:relative; width:320px; height:220px; margin:20px auto; border-radius:25px; overflow:hidden; box-shadow:0 15px 40px rgba(0,0,0,0.4);}
.scratch-bg{background:linear-gradient(45deg, hotpink, #ff1493); color:white; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; font-size:26px; font-weight:bold;}
#scratchCanvas{position:absolute; top:0; left:0; cursor:grab;}
/* SLIDESHOW */
.slideshow{position:relative; max-width:350px; margin:20px auto;}
.slideshow img{width:100%; border-radius:25px; border:5px solid white; box-shadow:0 10px 30px rgba(0,0,0,0.3); display:none;}
.slideshow img.active{display:block; animation:fade 1s;}
.message-popup{position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(255,255,255,0.95); padding:15px 20px; border-radius:20px; font-weight:bold; color:#ff1493; box-shadow:0 5px 15px rgba(0,0,0,0.2); animation:pop 0.5s;}
.music-btn{position:fixed; top:15px; right:15px; padding:12px 18px; background:linear-gradient(45deg, hotpink, #ff1493); color:white; border:none; border-radius:30px; z-index:100; cursor:pointer; box-shadow:0 5px 20px rgba(255,20,147,0.5);}
.wish-box{background:white; border-radius:30px; padding:25px; width:320px; margin:30px auto; box-shadow:0 15px 35px rgba(0,0,0,0.2); border:3px solid hotpink;}
.confetti{position:fixed; top:-10px; font-size:25px; animation:fall 4s linear infinite; z-index:99;}
@keyframes fall {to {transform: translateY(100vh) rotate(720deg);}}
@keyframes bounce{0%,100%{transform:scale(1);} 50%{transform:scale(1.1);}}
@keyframes fade{from{opacity:0;} to{opacity:1;}}
@keyframes pop{0%{transform:translateX(-50%) scale(0.5);} 100%{transform:translateX(-50%) scale(1);}}
</style>
</head>
<body>

<!-- PAGE 1: SCRATCH CARD -->
<div id="page1" class="screen">
  <h1>Happy Birthday Aastha 🐼🎉</h1>
  <p style="color:#d63384; font-size:18px;">Pehle isko scratch karo 👇</p>
  <div class="scratch-container">
    <div class="scratch-bg">
      <span>Tere liye surprise hai!</span>
      <span style="font-size:16px;">👇👇👇</span>
    </div>
    <canvas id="scratchCanvas" width="320" height="220"></canvas>
  </div>
</div>

<!-- PAGE 2: SLIDESHOW + WISH -->
<div id="page2" class="screen hidden">
  <audio id="bgmusic" loop>
    <source src="https://raw.githubusercontent.com/singhparidhi800-gif/verisame/main/Montagem%20Miau%20(Meow%20Meow%20Song).mp3" type="audio/mpeg">
  </audio>
  <button onclick="playMusic()" class="music-btn">🎵 Meow Music</button>

  <h1>Ye rahi teri duniya ❤️</h1>

  <!-- SLIDESHOW -->
  <div class="slideshow">
    <img src="https://i.postimg.cc/kgtq5jCg/Screenshot-2026-0728-161602.jpg" class="active">
    <img src="https://i.postimg.cc/tJrmdH3g/IMG-20260727-WA0012.jpg">
    <img src="https://i.postimg.cc/V6kqq0DF/IMG-20260727-WA0009.jpg">
    <img src="https://i.postimg.cc/YS3V2gvQ/Screenshot-2026-0728-161703.jpg">
    <img src="https://i.postimg.cc/Ghy5864K/Screenshot-2026-0728-161730.jpg">
    <div id="popup" class="message-popup hidden"></div>
  </div>

  <!-- FINAL WISH -->
  <div class="wish-box">
    <h2>💌 Tere liye</h2>
    <p>Happy Birthday Partner in Crime! 🎉😂<br>
    Yaad hai na bee wali baat? 😂<br>
    Ek saath teacher ki daat, ek saath golgappe 😋<br>
    Thankyou so much for everything ❤️🫶<br>
    Stay weird, stay mine!</p>
  </div>
</div>

<script>
let slideIndex = 0;
let slides = document.querySelectorAll('.slideshow img');
let messages = [
  "Ye wali selfie yaad hai? 😂",
  "Bee ne hume kata tha 😅",
  "Partner in crime forever ❤️",
  "Golgappe wali date 🍕",
  "Tujhe miss karti hun 🫶"
];

// SCRATCH LOGIC
const canvas = document.getElementById('scratchCanvas');
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#C0C0C0';
ctx.fillRect(0, 0, 320, 220);
ctx.font = "bold 20px Comic Sans MS";
ctx.fillStyle = "white";
ctx.fillText("Yaha Scratch Karo", 90, 110);
let isDrawing = false;
canvas.addEventListener('mousedown', ()=>isDrawing=true);
canvas.addEventListener('mouseup', ()=>isDrawing=false);
canvas.addEventListener('mousemove', scratch);
function scratch(e){
  if(!isDrawing) return;
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(e.offsetX, e.offsetY, 25, 0, Math.PI*2);
  ctx.fill();
  let data = ctx.getImageData(0,0,320,220).data;
  let cleared = 0;
  for(let i=3; i<data.length; i+=4){ if(data[i]==0) cleared++; }
  if(cleared > 320*220*0.5){
    setTimeout(()=>{
      document.getElementById('page1').classList.add('hidden');
      document.getElementById('page2').classList.remove('hidden');
      document.getElementById('bgmusic').play();
      makeConfetti();
      startSlideshow();
    }, 500);
  }
}

// SLIDESHOW LOGIC
function startSlideshow(){
  setInterval(()=>{
    slides[slideIndex].classList.remove('active');
    slideIndex = (slideIndex + 1) % slides.length;
    slides[slideIndex].classList.add('active');

    // Har 2nd photo pe message popup
    if(slideIndex % 2 == 0){
      let popup = document.getElementById('popup');
      popup.innerText = messages[slideIndex % messages.length];
      popup.classList.remove('hidden');
      setTimeout(()=>popup.classList.add('hidden'), 2000);
    }
  }, 3000); // 3 sec me photo change
}

function playMusic(){
  let music = document.getElementById('bgmusic');
  music.paused? music.play() : music.pause();
}
function makeConfetti(){
  for(let i=0; i<50; i++){
    let confetti = document.createElement("div");
    confetti.innerHTML = ["🎊","❤️","✨","🌟","💖"][Math.floor(Math.random()*5)];
    confetti.className = "confetti";
    confetti.style.left = Math.random()*100 + "%";
    confetti.style.animationDelay = Math.random()*3 + "s";
    document.body.appendChild(confetti);
  }
}
</script>

</body>
</html>
